{% extends "base.html" %}
{% block title %}404 Not Found — Habitty{% endblock %}

{% block content %}
<section class="error-page">
    <h1 class="error-code tabular-nums">404</h1>
    <h2 class="page-title">Page Not Found</h2>
    <p class="page-subtitle">The page or habit you are looking for does not exist or may have been deleted.</p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('auth.login') }}" class="btn btn-primary">
        Return to Dashboard
    </a>
</section>
{% endblock %}
