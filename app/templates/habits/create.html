{% extends "base.html" %}
{% block title %}Create Habit — Habitty{% endblock %}

{% block content %}
<section class="form-card">
    <h1 class="page-title">Create New Habit</h1>
    <p class="page-subtitle">Define a clear, repeatable habit to track daily or weekly.</p>

    <form method="POST" action="{{ url_for('habits.create') }}" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
            <label for="name">Habit Name</label>
            <input type="text" id="name" name="name" placeholder="e.g. Exercise" required maxlength="100" />
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3" placeholder="e.g. Workout for at least 45 minutes."></textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" placeholder="e.g. Fitness, Mindfulness, Study" value="Fitness" required maxlength="50" />
            </div>

            <div class="form-group">
                <label for="frequency">Frequency</label>
                <select id="frequency" name="frequency" required>
                    <option value="Daily">Daily</option>
                    <option value="Weekly">Weekly</option>
                </select>
            </div>

            <div class="form-group">
                <label for="target">Target</label>
                <input type="number" id="target" name="target" value="1" min="1" max="30" required />
            </div>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Save Habit</button>
        </div>
    </form>
</section>
{% endblock %}
