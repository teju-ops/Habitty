{% extends "base.html" %}
{% block title %}Edit {{ habit.name }} — Habitty{% endblock %}

{% block content %}
<section class="form-card">
    <h1 class="page-title">Edit Habit</h1>
    <p class="page-subtitle">Update "{{ habit.name }}" details or active status.</p>

    <form method="POST" action="{{ url_for('habits.edit', habit_id=habit.id) }}" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
            <label for="name">Habit Name</label>
            <input type="text" id="name" name="name" value="{{ habit.name }}" required maxlength="100" />
        </div>

        <div class="form-group">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="3">{{ habit.description }}</textarea>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="category">Category</label>
                <input type="text" id="category" name="category" value="{{ habit.category }}" required maxlength="50" />
            </div>

            <div class="form-group">
                <label for="frequency">Frequency</label>
                <select id="frequency" name="frequency" required>
                    <option value="Daily" {% if habit.frequency == 'Daily' %}selected{% endif %}>Daily</option>
                    <option value="Weekly" {% if habit.frequency == 'Weekly' %}selected{% endif %}>Weekly</option>
                </select>
            </div>

            <div class="form-group">
                <label for="target">Target</label>
                <input type="number" id="target" name="target" value="{{ habit.target }}" min="1" max="30" required />
            </div>
        </div>

        <div class="form-group checkbox-group">
            <label>
                <input type="checkbox" name="is_active" {% if habit.is_active %}checked{% endif %} />
                Active Habit (show in daily active targets)
            </label>
        </div>

        <div class="form-actions">
            <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline">Cancel</a>
            <button type="submit" class="btn btn-primary">Update Habit</button>
        </div>
    </form>
</section>
{% endblock %}
