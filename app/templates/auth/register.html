{% extends "base.html" %}
{% block title %}Register — Habitty{% endblock %}

{% block content %}
<section class="auth-card">
    <h1 class="page-title">Create your account</h1>
    <p class="page-subtitle">Start building consistent daily and weekly habits.</p>

    <form method="POST" action="{{ url_for('auth.register') }}" class="form-stack">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

        <div class="form-group">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                value="{{ username or '' }}"
                placeholder="e.g. tejaswini"
                required
                minlength="3"
                maxlength="64"
            />
        </div>

        <div class="form-group">
            <label for="email">Email Address</label>
            <input
                type="email"
                id="email"
                name="email"
                value="{{ email or '' }}"
                placeholder="you@example.com"
                required
            />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 6 characters"
                required
                minlength="6"
            />
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirm Password</label>
            <input
                type="password"
                id="confirm_password"
                name="confirm_password"
                placeholder="Re-enter your password"
                required
                minlength="6"
            />
        </div>

        <button type="submit" class="btn btn-primary btn-block">Create Account</button>
    </form>

    <p class="auth-footer">
        Already registered? <a href="{{ url_for('auth.login') }}">Sign in here</a>
    </p>
</section>
{% endblock %}
